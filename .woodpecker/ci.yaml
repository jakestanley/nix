when:
  - event: push
  - event: manual

steps:
  - name: validate
    image: nixos/nix
    environment:
      NIX_CONFIG: |
        system-features = kvm nixos-test
        build-users-group =
    volumes:
      - nix-cache:/nix
    commands:
      - >-
        nix
        --extra-experimental-features "nix-command flakes"
        flake check
        -L
        --show-trace
        --no-eval-cache
        --option sandbox false
  - name: enforce-main-pins
    image: alpine:3.20
    when:
      - branch: main
        event: push
      - branch: main
        event: manual
    commands:
      - ./scripts/check-main-branch-pins.sh
